name: Deploy to Hostinger Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Deploy to Hostinger public_html
        run: |
          echo "Syncing build to Hostinger public_html..."
          lftp -c "
          set ssl:check-hostname no;
          set ftp:ssl-allow no;
          open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
          mirror -R --verbose --exclude-glob api/data/leads.json dist/ public_html/;
          bye;
          "
          echo "Deployment sync completed successfully!"
